version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: love_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: love_music
      MYSQL_USER: love_user
      MYSQL_PASSWORD: love_password
      TZ: 'UTC'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: love_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      timeout: 10s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: love_api
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/love_music?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: love_user
      SPRING_DATASOURCE_PASSWORD: love_password
      WECHAT_APPID: ${WECHAT_APPID:-your_appid}
      WECHAT_APPSECRET: ${WECHAT_APPSECRET:-your_appsecret}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      TZ: 'UTC'
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - /data/music:/data/music
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/auth/me" ]
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: love_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /data/music:/usr/share/nginx/html/music:ro
    depends_on:
      - api
    command: nginx -g 'daemon off;'

volumes:
  mysql_data:
  redis_data:
